<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Display</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      transition: background 0.3s ease;
    }
    #display {
      font-size: 20px;
      font-weight: bold;
      color: black;
      text-align: center;
    }
  </style>
</head>
<body>

  <div style="position:relative;width:100%;height:100%;margin:0;padding:0;overflow:hidden;">
  <iframe
    src="https://ibb.co/FkRW3G9H"
    style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;margin:0;padding:0;display:block;"
    loading="lazy"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</div>
  
  <div id="display"></div>

  <script>
    const display = document.getElementById("display");

    function updateDisplay() {
      const text = localStorage.getItem("sharedText") || "";
      const bgColor = localStorage.getItem("bgColor") || "white";
      display.textContent = text;
      document.body.style.background = bgColor;
    }

    // On load
    updateDisplay();

    // Listen for updates
    window.addEventListener("storage", updateDisplay);
  </script>
</body>
</html>
